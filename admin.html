<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الأدمن | بوابة الشركة</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-anim"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

<!-- شاشة الدخول -->
<div id="loginView" class="login-wrap" hidden>
  <form class="glass login-card fade-in" onsubmit="adminLogin(event)">
    <div class="login-ico"><i class="fa-solid fa-user-shield"></i></div>
    <h2>دخول لوحة الأدمن</h2>
    <label>اسم المستخدم <input id="adUser" autocomplete="username" required></label>
    <label>كلمة المرور <input id="adPass" type="password" autocomplete="current-password" required></label>
    <button class="btn primary big" type="submit"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
    <p class="hint">بيانات الدخول الافتراضية: <b>admin</b> / <b>admin123</b><br>غيّرها فورًا من الإعدادات بعد أول دخول.</p>
    <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-right"></i> رجوع للموقع</a>
  </form>
</div>

<!-- لوحة التحكم -->
<div id="panelView" hidden>
  <div class="admin-layout">
    <aside class="sidebar glass">
      <div class="side-brand"><i class="fa-solid fa-user-shield"></i> لوحة تحكم الأدمن</div>
      <nav id="adminMenu"></nav>
    </aside>
    <main id="adminContent" class="admin-main"></main>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
